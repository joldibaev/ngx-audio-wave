<audio
  #audioRef
  [src]="audioElementSrc()"
  (durationchange)="durationChange($event)"
  (loadedmetadata)="durationChange($event)"
  (pause)="pauseChange($event)"
  (play)="pauseChange($event)"
  (timeupdate)="timeChange($event)"
  hidden="hidden"
></audio>

<div
  class="ngx-audio-wave-wrapper"
  [attr.aria-label]="ariaLabel() || 'Audio player'"
  [style.--ngx-audio-wave-color]="color()"
  role="region"
>
  @if (!hasError()) {
    @if (!hideBtn()) {
      @if (isPaused()) {
        <button
          class="ngx-audio-wave-btn"
          [attr.aria-label]="playButtonLabel()"
          [attr.aria-pressed]="false"
          (click)="play()"
          type="button"
        >
          <svg
            aria-hidden="true"
            height="16"
            viewBox="0 0 16 16"
            width="16"
            xmlns="http://www.w3.org/2000/svg"
          >
            <path
              d="m11.596 8.697-6.363 3.692c-.54.313-1.233-.066-1.233-.697V4.308c0-.63.692-1.01 1.233-.696l6.363 3.692a.802.802 0 0 1 0 1.393z"
            />
          </svg>
        </button>
      } @else {
        <button
          class="ngx-audio-wave-btn"
          [attr.aria-label]="pauseButtonLabel()"
          [attr.aria-pressed]="true"
          (click)="pause()"
          type="button"
        >
          <svg
            aria-hidden="true"
            height="16"
            viewBox="0 0 16 16"
            width="16"
            xmlns="http://www.w3.org/2000/svg"
          >
            <path
              d="M5.5 3.5A1.5 1.5 0 0 1 7 5v6a1.5 1.5 0 0 1-3 0V5a1.5 1.5 0 0 1 1.5-1.5zm5 0A1.5 1.5 0 0 1 12 5v6a1.5 1.5 0 0 1-3 0V5a1.5 1.5 0 0 1 1.5-1.5z"
            />
          </svg>
        </button>
      }
    }

    <div
      class="ngx-audio-wave"
      [attr.aria-label]="progressBarLabel()"
      [attr.aria-orientation]="'horizontal'"
      [attr.aria-valuemax]="100"
      [attr.aria-valuemin]="0"
      [attr.aria-valuenow]="exactPlayedPercent()"
      [attr.aria-valuetext]="progressText()"
      [style.height.px]="visualHeight()"
      [style.width.px]="width()"
      (click)="setTime($event)"
      (keydown)="onKeyDown($event)"
      (mouseleave)="clearHoverPosition()"
      (mousemove)="setHoverPosition($event)"
      role="slider"
      tabindex="0"
    >
      @if (!isLoading()) {
        <svg
          class="ngx-audio-wave-svg"
          [attr.viewBox]="`0 0 ${width()} ${visualHeight()}`"
          aria-hidden="true"
        >
          <defs>
            <linearGradient
              [attr.id]="gradientId"
              [attr.x2]="width()"
              gradientUnits="userSpaceOnUse"
              x1="0"
              y1="0"
              y2="0"
            >
              <stop offset="0%" stop-color="var(--ngx-audio-wave-color)" />
              <stop
                [attr.offset]="progressOffset()"
                stop-color="var(--ngx-audio-wave-color)"
              />
              <stop
                [attr.offset]="progressOffset()"
                stop-color="var(--ngx-audio-wave-color)"
                stop-opacity="0.3"
              />
              <stop
                offset="100%"
                stop-color="var(--ngx-audio-wave-color)"
                stop-opacity="0.3"
              />
            </linearGradient>
          </defs>

          @for (rect of normalizedData(); track index; let index = $index) {
            <rect
              [attr.fill]="`url(#${gradientId})`"
              [attr.height]="rect * visualHeight()"
              [attr.rx]="rounded() ? 1 : 0"
              [attr.ry]="rounded() ? 1 : 0"
              [attr.width]="2"
              [attr.x]="index * visualGap()"
              [attr.y]="visualHeight() - rect * visualHeight()"
            ></rect>
          }
        </svg>

        @if (isHovering()) {
          <span
            class="ngx-audio-wave-hover-guide"
            [style.left.px]="hoverOffset()"
            aria-hidden="true"
          ></span>
        }
      } @else {
        <div
          class="ngx-audio-wave-loading"
          aria-label="Loading audio"
          role="status"
        >
          <span></span>
          <span></span>
          <span></span>
        </div>
      }
    </div>

    <!-- Live region for screen readers -->
    <div class="ngx-audio-wave-sr-only" aria-atomic="true" aria-live="polite">
      {{ statusText() }}
    </div>
  } @else {
    <div aria-label="Audio loading error" role="alert">
      Some errors occurred
    </div>
  }
</div>
